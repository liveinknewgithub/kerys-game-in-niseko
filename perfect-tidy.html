<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Tidy - Satisfying Organization Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Title Screen */
        #title-screen {
            text-align: center;
            color: white;
        }

        #title-screen h1 {
            font-size: 4rem;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #title-screen p {
            font-size: 1.5rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Level Select */
        #level-select {
            display: none;
            text-align: center;
            color: white;
        }

        #level-select h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 600px;
        }

        .level-btn {
            width: 100px;
            height: 100px;
            background: white;
            border: none;
            border-radius: 20px;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .level-btn:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .level-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .level-btn .stars {
            font-size: 0.8rem;
            color: #ffd700;
        }

        .level-btn .icon {
            font-size: 2.5rem;
        }

        /* Game Screen */
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        #game-header {
            background: rgba(255,255,255,0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #game-header h3 {
            font-size: 1.5rem;
            color: #333;
        }

        #progress-bar {
            width: 200px;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s ease;
        }

        #timer {
            font-size: 1.3rem;
            color: #666;
        }

        .header-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
        }

        #game-area {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            background: linear-gradient(180deg, #f5f7fa 0%, #e4e8eb 100%);
        }

        /* Items area (left side) */
        #items-area {
            flex: 1;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 15px;
            overflow-y: auto;
        }

        .item {
            width: 80px;
            height: 80px;
            background: #f0f0f0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .item.selected {
            transform: scale(1.15);
            box-shadow: 0 0 0 4px #4CAF50, 0 15px 40px rgba(0,0,0,0.3);
            z-index: 100;
            animation: pulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1.1); }
            to { transform: scale(1.2); }
        }

        .item.placed {
            display: none;
        }

        /* Target area (right side) */
        #target-area {
            flex: 1.5;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
        }

        .target-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Closet specific styles */
        .closet-bg {
            background: linear-gradient(180deg, #8B4513 0%, #A0522D 100%);
            border-radius: 15px;
            padding: 15px;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
        }

        /* Fridge specific styles */
        .fridge-bg {
            background: linear-gradient(180deg, #e8e8e8 0%, #d0d0d0 100%);
            border: 8px solid #888;
            border-radius: 15px;
            padding: 15px;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
        }

        /* Desk specific styles */
        .desk-bg {
            background: linear-gradient(180deg, #DEB887 0%, #D2B48C 100%);
            border-radius: 15px;
            padding: 15px;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
        }

        /* Bookshelf specific styles */
        .bookshelf-bg {
            background: linear-gradient(180deg, #5D4037 0%, #4E342E 100%);
            border-radius: 15px;
            padding: 15px;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
        }

        .slot {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border: 3px dashed rgba(255,255,255,0.5);
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .slot:hover:not(.filled) {
            background: rgba(255,255,255,0.5);
            transform: scale(1.02);
        }

        .slot.highlight {
            background: rgba(76, 175, 80, 0.4);
            border-color: #4CAF50;
            transform: scale(1.05);
        }

        .slot.wrong {
            background: rgba(244, 67, 54, 0.4);
            border-color: #f44336;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .slot.filled {
            background: rgba(255,255,255,0.8);
            border: 3px solid rgba(76, 175, 80, 0.8);
        }

        .slot .hint {
            opacity: 0.3;
            font-size: 2rem;
        }

        /* Sparkle effect */
        .sparkle {
            position: absolute;
            pointer-events: none;
            animation: sparkle 0.6s ease-out forwards;
        }

        @keyframes sparkle {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
        }

        /* Complete screen */
        #complete-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        #complete-screen h2 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: bounce 1s ease-in-out infinite;
        }

        #complete-screen .stars-display {
            font-size: 4rem;
            margin-bottom: 30px;
        }

        #complete-screen .stats {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .complete-buttons {
            display: flex;
            gap: 20px;
        }

        /* Sound toggle */
        #sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Back button */
        #back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
        }

        /* Hint button */
        #hint-btn {
            background: #FFD700;
            color: #333;
        }

        /* ========== CLEANING MODE STYLES ========== */

        /* Cleaning surface backgrounds */
        .window-bg {
            background: linear-gradient(135deg, #87CEEB 0%, #ADD8E6 100%);
            border: 15px solid #8B4513;
            border-radius: 10px;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .mirror-bg {
            background: linear-gradient(135deg, #E8E8E8 0%, #D3D3D3 50%, #E8E8E8 100%);
            border: 20px solid #DAA520;
            border-radius: 15px;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .floor-bg {
            background: linear-gradient(90deg, #DEB887 0%, #D2B48C 10%, #DEB887 20%, #D2B48C 30%, #DEB887 40%, #D2B48C 50%, #DEB887 60%, #D2B48C 70%, #DEB887 80%, #D2B48C 90%, #DEB887 100%);
            border-radius: 10px;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .counter-bg {
            background: linear-gradient(180deg, #696969 0%, #808080 100%);
            border-radius: 10px;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .car-bg {
            background: linear-gradient(180deg, #DC143C 0%, #B22222 100%);
            border-radius: 30px;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Dirt spot styles */
        .dirt-spot {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .dirt-spot:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .dirt-spot.cleaning {
            animation: scrub 0.15s ease-in-out;
        }

        @keyframes scrub {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-5deg) scale(0.95); }
            75% { transform: rotate(5deg) scale(0.95); }
        }

        .dirt-spot.cleaned {
            animation: cleanPop 0.4s ease-out forwards;
        }

        @keyframes cleanPop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Different dirt types */
        .dirt-mud {
            background: radial-gradient(ellipse, #5D4037 0%, #3E2723 100%);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .dirt-dust {
            background: radial-gradient(ellipse, rgba(169,169,169,0.8) 0%, rgba(128,128,128,0.6) 100%);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .dirt-splash {
            background: radial-gradient(ellipse, #4169E1 0%, #1E90FF 100%);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .dirt-food {
            background: radial-gradient(ellipse, #FF6347 0%, #CD5C5C 100%);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .dirt-grease {
            background: radial-gradient(ellipse, rgba(255,215,0,0.7) 0%, rgba(184,134,11,0.8) 100%);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .dirt-fingerprint {
            background: radial-gradient(ellipse, rgba(200,200,200,0.5) 0%, rgba(150,150,150,0.3) 100%);
            border: 2px solid rgba(150,150,150,0.4);
        }

        /* Clean sparkle burst */
        .clean-burst {
            position: absolute;
            pointer-events: none;
            font-size: 2rem;
            animation: burstOut 0.5s ease-out forwards;
        }

        @keyframes burstOut {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(2) rotate(180deg); opacity: 0; }
        }

        /* Cleaning mode hides the items area */
        .cleaning-mode #items-area {
            display: none;
        }

        .cleaning-mode #target-area {
            flex: 1;
        }

        /* Cleaning instructions */
        .cleaning-instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1.1rem;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Title Screen -->
        <div id="title-screen">
            <h1>✨ Perfect Tidy ✨</h1>
            <p>Tap to clean everything spotless!</p>
            <button class="btn" onclick="showLevelSelect()">Play Now</button>
        </div>

        <!-- Level Select -->
        <div id="level-select">
            <h2>Select Level</h2>
            <div class="level-grid" id="level-grid">
                <!-- Levels will be generated here -->
            </div>
            <br><br>
            <button class="btn" onclick="showTitleScreen()">Back</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen">
            <div id="game-header">
                <h3 id="level-title">Level 1</h3>
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                </div>
                <div id="timer">⏱️ 0:00</div>
                <button class="header-btn" id="hint-btn" onclick="showHint()">💡 Hint</button>
            </div>
            <div id="game-area">
                <div id="items-area">
                    <!-- Draggable items will be here -->
                </div>
                <div id="target-area">
                    <!-- Target slots will be here -->
                </div>
            </div>
        </div>

        <!-- Complete Screen -->
        <div id="complete-screen">
            <h2>🎉 Perfect! 🎉</h2>
            <div class="stars-display" id="stars-earned">⭐⭐⭐</div>
            <div class="stats" id="complete-stats">
                Time: 0:30<br>
                Moves: 12
            </div>
            <div class="complete-buttons">
                <button class="btn" onclick="restartLevel()">🔄 Retry</button>
                <button class="btn" onclick="nextLevel()">▶️ Next</button>
                <button class="btn" onclick="showLevelSelect()">📋 Levels</button>
            </div>
        </div>
    </div>

    <button id="sound-toggle" onclick="toggleSound()">🔊</button>
    <button id="back-btn" onclick="showLevelSelect()">←</button>

    <script>
        // Game State
        let currentLevel = 0;
        let placedItems = 0;
        let totalItems = 0;
        let moves = 0;
        let startTime = 0;
        let timerInterval = null;
        let soundEnabled = true;
        let levelProgress = JSON.parse(localStorage.getItem('perfectTidyProgress') || '{}');

        // Audio Context
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            switch(type) {
                case 'pickup':
                    oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'place':
                    oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'wrong':
                    oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.2);
                    break;
                case 'complete':
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
                        osc.start(audioCtx.currentTime + i * 0.15);
                        osc.stop(audioCtx.currentTime + i * 0.15 + 0.3);
                    });
                    break;
                case 'scrub':
                    // Quick scrubbing sound
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
                    gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.08);
                    break;
                case 'clean':
                    // Satisfying clean pop
                    oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.2);
                    break;
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
        }

        // Level Definitions - All Cleaning Levels
        const LEVELS = [
            {
                id: 1,
                name: "Dirty Window",
                icon: "🪟",
                type: "cleaning",
                surface: "window",
                dirtCount: 10,
                dirtTypes: ["dust", "fingerprint", "splash"],
                clicksToClean: 2
            },
            {
                id: 2,
                name: "Messy Mirror",
                icon: "🪞",
                type: "cleaning",
                surface: "mirror",
                dirtCount: 12,
                dirtTypes: ["fingerprint", "splash", "dust"],
                clicksToClean: 2
            },
            {
                id: 3,
                name: "Muddy Floor",
                icon: "🧹",
                type: "cleaning",
                surface: "floor",
                dirtCount: 15,
                dirtTypes: ["mud", "dust"],
                clicksToClean: 3
            },
            {
                id: 4,
                name: "Greasy Counter",
                icon: "🧽",
                type: "cleaning",
                surface: "counter",
                dirtCount: 14,
                dirtTypes: ["grease", "food", "splash"],
                clicksToClean: 3
            },
            {
                id: 5,
                name: "Dirty Car",
                icon: "🚗",
                type: "cleaning",
                surface: "car",
                dirtCount: 18,
                dirtTypes: ["mud", "dust", "splash"],
                clicksToClean: 3
            },
            {
                id: 6,
                name: "Dusty Bookshelf",
                icon: "📚",
                type: "cleaning",
                surface: "floor",
                dirtCount: 20,
                dirtTypes: ["dust", "dust", "fingerprint"],
                clicksToClean: 2
            },
            {
                id: 7,
                name: "Messy Kitchen",
                icon: "🍳",
                type: "cleaning",
                surface: "counter",
                dirtCount: 16,
                dirtTypes: ["food", "grease", "splash"],
                clicksToClean: 4
            },
            {
                id: 8,
                name: "Bathroom Tiles",
                icon: "🚿",
                type: "cleaning",
                surface: "mirror",
                dirtCount: 22,
                dirtTypes: ["splash", "dust", "fingerprint"],
                clicksToClean: 3
            }
        ];

        // Navigation
        function showTitleScreen() {
            document.getElementById('title-screen').style.display = 'block';
            document.getElementById('level-select').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('complete-screen').style.display = 'none';
            document.getElementById('back-btn').style.display = 'none';
            stopTimer();
        }

        function showLevelSelect() {
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('level-select').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('complete-screen').style.display = 'none';
            document.getElementById('back-btn').style.display = 'none';
            generateLevelGrid();
            stopTimer();
        }

        function generateLevelGrid() {
            const grid = document.getElementById('level-grid');
            grid.innerHTML = '';

            LEVELS.forEach((level, index) => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';

                const stars = levelProgress[level.id] || 0;
                const isUnlocked = index === 0 || levelProgress[LEVELS[index - 1].id] > 0;

                btn.innerHTML = `
                    <span class="icon">${level.icon}</span>
                    <span class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</span>
                `;

                btn.disabled = !isUnlocked;
                btn.onclick = () => startLevel(index);

                grid.appendChild(btn);
            });
        }

        function startLevel(levelIndex) {
            initAudio();
            currentLevel = levelIndex;
            const level = LEVELS[levelIndex];

            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('level-select').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('complete-screen').style.display = 'none';
            document.getElementById('back-btn').style.display = 'block';

            document.getElementById('level-title').textContent = `Level ${level.id}: ${level.name}`;

            // Show/hide hint button based on level type
            document.getElementById('hint-btn').style.display = level.type === 'cleaning' ? 'none' : 'block';

            setupLevel(level);
            startTimer();
        }

        function setupLevel(level) {
            placedItems = 0;
            moves = 0;
            selectedItem = null;

            const gameArea = document.getElementById('game-area');

            // Check if this is a cleaning level
            if (level.type === 'cleaning') {
                gameArea.classList.add('cleaning-mode');
                setupCleaningLevel(level);
            } else {
                gameArea.classList.remove('cleaning-mode');
                setupOrganizingLevel(level);
            }
        }

        // Setup for organizing levels (original gameplay)
        function setupOrganizingLevel(level) {
            totalItems = level.items.length;
            updateProgress();

            // Setup items area
            const itemsArea = document.getElementById('items-area');
            itemsArea.innerHTML = '';

            // Shuffle items
            const shuffledItems = [...level.items].sort(() => Math.random() - 0.5);

            shuffledItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.textContent = item.emoji;
                div.dataset.emoji = item.emoji;
                div.dataset.targetSlot = item.slot;
                div.id = `item-${index}`;

                // Click to select
                div.addEventListener('click', () => selectItem(div));

                itemsArea.appendChild(div);
            });

            // Setup target area
            const targetArea = document.getElementById('target-area');
            targetArea.innerHTML = '';

            const container = document.createElement('div');
            container.className = `${level.type}-bg target-container`;

            const slotCount = level.type === 'bookshelf' ? 15 : 12;

            for (let i = 0; i < slotCount; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.slotIndex = i;

                // Find which item goes here and show hint
                const itemForSlot = level.items.find(item => item.slot === i);
                if (itemForSlot) {
                    const hint = document.createElement('span');
                    hint.className = 'hint';
                    hint.textContent = itemForSlot.emoji;
                    slot.appendChild(hint);
                }

                // Click to place selected item
                slot.addEventListener('click', () => placeInSlot(slot));

                container.appendChild(slot);
            }

            targetArea.appendChild(container);
        }

        // Setup for cleaning levels
        let cleanedSpots = 0;
        let totalSpots = 0;

        function setupCleaningLevel(level) {
            cleanedSpots = 0;
            totalSpots = level.dirtCount;
            totalItems = totalSpots; // For progress bar
            updateProgress();

            // Clear items area (hidden in cleaning mode anyway)
            const itemsArea = document.getElementById('items-area');
            itemsArea.innerHTML = '';

            // Setup cleaning surface
            const targetArea = document.getElementById('target-area');
            targetArea.innerHTML = '';

            const container = document.createElement('div');
            container.className = `${level.surface}-bg target-container`;

            // Add instruction text
            const instructions = document.createElement('div');
            instructions.className = 'cleaning-instructions';
            instructions.textContent = '👆 Tap the dirt to clean it!';
            container.appendChild(instructions);

            // Generate random dirt spots
            for (let i = 0; i < level.dirtCount; i++) {
                const dirt = createDirtSpot(level, i);
                container.appendChild(dirt);
            }

            targetArea.appendChild(container);
        }

        function createDirtSpot(level, index) {
            const dirt = document.createElement('div');

            // Random dirt type
            const dirtType = level.dirtTypes[Math.floor(Math.random() * level.dirtTypes.length)];
            dirt.className = `dirt-spot dirt-${dirtType}`;

            // Random size
            const size = 40 + Math.random() * 50;
            dirt.style.width = size + 'px';
            dirt.style.height = size * (0.7 + Math.random() * 0.6) + 'px';

            // Random position (keeping away from edges)
            const margin = 60;
            dirt.style.left = (margin + Math.random() * (100 - margin * 2 / 5)) + '%';
            dirt.style.top = (margin/3 + Math.random() * (100 - margin)) + '%';
            dirt.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;

            // Track clicks needed
            dirt.dataset.clicksRemaining = level.clicksToClean;
            dirt.dataset.index = index;

            // Click to clean
            dirt.addEventListener('click', () => cleanDirt(dirt, level));

            return dirt;
        }

        function cleanDirt(dirt, level) {
            if (dirt.classList.contains('cleaned')) return;

            let remaining = parseInt(dirt.dataset.clicksRemaining);
            remaining--;
            dirt.dataset.clicksRemaining = remaining;

            moves++;

            if (remaining > 0) {
                // Still needs more cleaning
                playSound('scrub');
                dirt.classList.add('cleaning');
                setTimeout(() => dirt.classList.remove('cleaning'), 150);

                // Shrink slightly and fade
                const scale = 0.5 + (remaining / level.clicksToClean) * 0.5;
                const opacity = 0.4 + (remaining / level.clicksToClean) * 0.6;
                dirt.style.transform = dirt.style.transform.replace(/scale\([^)]*\)/, '') + ` scale(${scale})`;
                dirt.style.opacity = opacity;
            } else {
                // Fully cleaned!
                playSound('clean');
                dirt.classList.add('cleaned');

                // Create clean burst effect
                createCleanBurst(dirt);

                cleanedSpots++;
                placedItems = cleanedSpots; // For progress bar
                updateProgress();

                // Check if level complete
                if (cleanedSpots === totalSpots) {
                    setTimeout(completeLevel, 500);
                }
            }
        }

        function createCleanBurst(element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const bursts = ['✨', '💫', '⭐', '🫧', '💧'];

            for (let i = 0; i < 5; i++) {
                const burst = document.createElement('div');
                burst.className = 'clean-burst';
                burst.textContent = bursts[Math.floor(Math.random() * bursts.length)];
                burst.style.left = centerX + 'px';
                burst.style.top = centerY + 'px';
                document.body.appendChild(burst);

                setTimeout(() => burst.remove(), 500);
            }
        }

        // Click to Select and Place
        let selectedItem = null;

        function selectItem(item) {
            if (item.classList.contains('placed')) return;

            // Deselect previous item
            if (selectedItem) {
                selectedItem.classList.remove('selected');
            }

            // Select new item (or deselect if clicking same item)
            if (selectedItem === item) {
                selectedItem = null;
            } else {
                selectedItem = item;
                item.classList.add('selected');
                playSound('pickup');
            }
        }

        function placeInSlot(slot) {
            if (!selectedItem) return;
            if (slot.classList.contains('filled')) return;

            moves++;

            const expectedSlot = parseInt(selectedItem.dataset.targetSlot);
            const actualSlot = parseInt(slot.dataset.slotIndex);

            if (expectedSlot === actualSlot) {
                // Correct placement!
                placeItem(selectedItem, slot);
                selectedItem = null;
            } else {
                // Wrong slot
                playSound('wrong');
                slot.classList.add('wrong');
                setTimeout(() => slot.classList.remove('wrong'), 300);
            }
        }

        function placeItem(item, slot) {
            playSound('place');

            // Clear hint
            const hint = slot.querySelector('.hint');
            if (hint) hint.remove();

            // Add emoji to slot
            slot.textContent = item.dataset.emoji;
            slot.classList.add('filled');

            // Create sparkle effect
            createSparkles(slot);

            // Hide the item and remove selection
            item.classList.remove('selected');
            item.classList.add('placed');

            placedItems++;
            updateProgress();

            // Check if level complete
            if (placedItems === totalItems) {
                setTimeout(completeLevel, 500);
            }
        }

        function createSparkles(element) {
            const rect = element.getBoundingClientRect();
            const sparkles = ['✨', '⭐', '💫', '🌟'];

            for (let i = 0; i < 6; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
                sparkle.style.left = (rect.left + Math.random() * rect.width) + 'px';
                sparkle.style.top = (rect.top + Math.random() * rect.height) + 'px';
                sparkle.style.fontSize = (20 + Math.random() * 20) + 'px';
                document.body.appendChild(sparkle);

                setTimeout(() => sparkle.remove(), 600);
            }
        }

        function updateProgress() {
            const percent = (placedItems / totalItems) * 100;
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        // Timer
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timer').textContent = `⏱️ ${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function getElapsedTime() {
            return Math.floor((Date.now() - startTime) / 1000);
        }

        // Level Complete
        function completeLevel() {
            stopTimer();
            playSound('complete');

            const time = getElapsedTime();
            const level = LEVELS[currentLevel];

            // Calculate stars based on time and moves
            let stars = 1;
            const perfectMoves = totalItems;
            const moveRatio = moves / perfectMoves;

            if (time < 60 && moveRatio <= 1.5) stars = 3;
            else if (time < 120 && moveRatio <= 2) stars = 2;

            // Save progress
            if (!levelProgress[level.id] || levelProgress[level.id] < stars) {
                levelProgress[level.id] = stars;
                localStorage.setItem('perfectTidyProgress', JSON.stringify(levelProgress));
            }

            // Show complete screen
            document.getElementById('complete-screen').style.display = 'flex';
            document.getElementById('stars-earned').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);

            const minutes = Math.floor(time / 60);
            const seconds = time % 60;
            const actionLabel = level.type === 'cleaning' ? 'Taps' : 'Moves';
            document.getElementById('complete-stats').innerHTML = `
                Time: ${minutes}:${seconds.toString().padStart(2, '0')}<br>
                ${actionLabel}: ${moves}
            `;
        }

        function restartLevel() {
            document.getElementById('complete-screen').style.display = 'none';
            startLevel(currentLevel);
        }

        function nextLevel() {
            document.getElementById('complete-screen').style.display = 'none';
            if (currentLevel < LEVELS.length - 1) {
                startLevel(currentLevel + 1);
            } else {
                showLevelSelect();
            }
        }

        function showHint() {
            // Highlight a random unplaced item's target slot
            const unplacedItems = document.querySelectorAll('.item:not(.placed)');
            if (unplacedItems.length === 0) return;

            const randomItem = unplacedItems[Math.floor(Math.random() * unplacedItems.length)];
            const targetSlotIndex = randomItem.dataset.targetSlot;
            const targetSlot = document.querySelector(`.slot[data-slot-index="${targetSlotIndex}"]`);

            if (targetSlot && !targetSlot.classList.contains('filled')) {
                targetSlot.classList.add('highlight');
                setTimeout(() => targetSlot.classList.remove('highlight'), 2000);
            }
        }

        // Initialize
        showTitleScreen();
    </script>
</body>
</html>
