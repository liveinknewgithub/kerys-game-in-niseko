        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        #game-container {

            height: 100vh;

        /* Title Screen */

            color: white;
        }

        #title-screen h1 {

            text-shadow: 4px 4px 8px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #title-screen p {
            font-size: 1.5rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Level Select */
        #level-select {
            display: none;
            text-align: center;
            color: white;
        }

        #level-select h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 600px;
        }

        .level-btn {
            width: 100px;
            height: 100px;
            background: white;
            border: none;
            border-radius: 20px;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .level-btn:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .level-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .level-btn .stars {
            font-size: 0.8rem;
            color: #ffd700;
        }

        .level-btn .icon {
            font-size: 2.5rem;
        }

            width: 100%;
            height: 100%;

        }

        #game-header {
            background: rgba(255,255,255,0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;

            to { transform: scale(1.2); }

            grid-template-rows: repeat(4, 1fr);

            grid-template-rows: repeat(3, 1fr);

            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr);

        .slot {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border: 3px dashed rgba(255,255,255,0.5);
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .slot:hover:not(.filled) {

            transform: scale(1.02);
        }

        .slot.highlight {
            background: rgba(76, 175, 80, 0.4);
            border-color: #4CAF50;
            transform: scale(1.05);
        }

        .slot.wrong {
            background: rgba(244, 67, 54, 0.4);

            animation: shake 0.3s ease;
        }

        }

            pointer-events: none;

        // Game State
        let currentLevel = 0;
        let placedItems = 0;
        let totalItems = 0;
        let moves = 0;
        let startTime = 0;
        let timerInterval = null;
        let soundEnabled = true;
        let levelProgress = JSON.parse(localStorage.getItem('perfectTidyProgress') || '{}');

        // Audio Context
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            switch(type) {
                case 'pickup':
                    oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'place':
                    oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'wrong':
                    oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.2);
                    break;
                case 'complete':
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
                        osc.start(audioCtx.currentTime + i * 0.15);
                        osc.stop(audioCtx.currentTime + i * 0.15 + 0.3);
                    });
                    break;
            }
        }

        // Navigation
        function showTitleScreen() {
            document.getElementById('title-screen').style.display = 'block';
            document.getElementById('level-select').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('complete-screen').style.display = 'none';
            document.getElementById('back-btn').style.display = 'none';
            stopTimer();
        }

        function showLevelSelect() {
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('level-select').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('complete-screen').style.display = 'none';
            document.getElementById('back-btn').style.display = 'none';
            generateLevelGrid();
            stopTimer();
        }

        function generateLevelGrid() {
            const grid = document.getElementById('level-grid');
            grid.innerHTML = '';

            LEVELS.forEach((level, index) => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';

                const stars = levelProgress[level.id] || 0;
                const isUnlocked = index === 0 || levelProgress[LEVELS[index - 1].id] > 0;

                btn.innerHTML = `
                    <span class="icon">${level.icon}</span>
                    <span class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</span>
                `;

                btn.disabled = !isUnlocked;
                btn.onclick = () => startLevel(index);

                grid.appendChild(btn);
            });
        }

        function startLevel(levelIndex) {
            initAudio();
            currentLevel = levelIndex;
            const level = LEVELS[levelIndex];

            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('level-select').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('complete-screen').style.display = 'none';
            document.getElementById('back-btn').style.display = 'block';

            document.getElementById('level-title').textContent = `Level ${level.id}: ${level.name}`;

            setupLevel(level);
            startTimer();
        }

        function setupLevel(level) {
            placedItems = 0;
            totalItems = level.items.length;
            moves = 0;
            selectedItem = null;
            updateProgress();

            // Setup items area
            const itemsArea = document.getElementById('items-area');
            itemsArea.innerHTML = '';

            // Shuffle items
            const shuffledItems = [...level.items].sort(() => Math.random() - 0.5);

            shuffledItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.textContent = item.emoji;
                div.dataset.emoji = item.emoji;
                div.dataset.targetSlot = item.slot;
                div.id = `item-${index}`;

                // Click to select
                div.addEventListener('click', () => selectItem(div));

                itemsArea.appendChild(div);
            });

            // Setup target area
            const targetArea = document.getElementById('target-area');
            targetArea.innerHTML = '';

            const container = document.createElement('div');
            container.className = `${level.type}-bg target-container`;

            const slotCount = level.type === 'bookshelf' ? 15 : 12;

            for (let i = 0; i < slotCount; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.slotIndex = i;

                // Find which item goes here and show hint
                const itemForSlot = level.items.find(item => item.slot === i);
                if (itemForSlot) {
                    const hint = document.createElement('span');
                    hint.className = 'hint';
                    hint.textContent = itemForSlot.emoji;
                    slot.appendChild(hint);
                }

                // Click to place selected item
                slot.addEventListener('click', () => placeInSlot(slot));

                container.appendChild(slot);
            }

            targetArea.appendChild(container);
        }

        // Click to Select and Place
        let selectedItem = null;

        function selectItem(item) {
            if (item.classList.contains('placed')) return;

            // Deselect previous item
            if (selectedItem) {
                selectedItem.classList.remove('selected');
            }

            // Select new item (or deselect if clicking same item)
            if (selectedItem === item) {
                selectedItem = null;
            } else {
                selectedItem = item;
                item.classList.add('selected');
                playSound('pickup');
            }
        }

        function placeInSlot(slot) {
            if (!selectedItem) return;
            if (slot.classList.contains('filled')) return;

            moves++;

            const expectedSlot = parseInt(selectedItem.dataset.targetSlot);
            const actualSlot = parseInt(slot.dataset.slotIndex);

            if (expectedSlot === actualSlot) {
                // Correct placement!
                placeItem(selectedItem, slot);
                selectedItem = null;
            } else {
                // Wrong slot
                playSound('wrong');
                slot.classList.add('wrong');
                setTimeout(() => slot.classList.remove('wrong'), 300);
            }
        }

        function placeItem(item, slot) {
            playSound('place');

            // Clear hint
            const hint = slot.querySelector('.hint');
            if (hint) hint.remove();

            // Add emoji to slot
            slot.textContent = item.dataset.emoji;
            slot.classList.add('filled');

            // Create sparkle effect
            createSparkles(slot);

            // Hide the item and remove selection
            item.classList.remove('selected');
            item.classList.add('placed');

            placedItems++;
            updateProgress();

            // Check if level complete
            if (placedItems === totalItems) {
                setTimeout(completeLevel, 500);
            }
        }

        function createSparkles(element) {
            const rect = element.getBoundingClientRect();
            const sparkles = ['✨', '⭐', '💫', '🌟'];

            for (let i = 0; i < 6; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
                sparkle.style.left = (rect.left + Math.random() * rect.width) + 'px';
                sparkle.style.top = (rect.top + Math.random() * rect.height) + 'px';
                sparkle.style.fontSize = (20 + Math.random() * 20) + 'px';
                document.body.appendChild(sparkle);

                setTimeout(() => sparkle.remove(), 600);
            }
        }

        function updateProgress() {
            const percent = (placedItems / totalItems) * 100;
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        // Timer
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timer').textContent = `⏱️ ${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function getElapsedTime() {
            return Math.floor((Date.now() - startTime) / 1000);
        }

        // Level Complete
        function completeLevel() {
            stopTimer();
            playSound('complete');

            const time = getElapsedTime();
            const level = LEVELS[currentLevel];

            // Calculate stars based on time and moves
            let stars = 1;
            const perfectMoves = totalItems;
            const moveRatio = moves / perfectMoves;

            if (time < 60 && moveRatio <= 1.5) stars = 3;
            else if (time < 120 && moveRatio <= 2) stars = 2;

            // Save progress
            if (!levelProgress[level.id] || levelProgress[level.id] < stars) {
                levelProgress[level.id] = stars;
                localStorage.setItem('perfectTidyProgress', JSON.stringify(levelProgress));
            }

            // Show complete screen
            document.getElementById('complete-screen').style.display = 'flex';
            document.getElementById('stars-earned').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);

            const minutes = Math.floor(time / 60);
            const seconds = time % 60;
            document.getElementById('complete-stats').innerHTML = `
                Time: ${minutes}:${seconds.toString().padStart(2, '0')}<br>
                Moves: ${moves}
            `;
        }

        function restartLevel() {
            document.getElementById('complete-screen').style.display = 'none';
            startLevel(currentLevel);
        }

        function nextLevel() {
            document.getElementById('complete-screen').style.display = 'none';
            if (currentLevel < LEVELS.length - 1) {
                startLevel(currentLevel + 1);
            } else {
                showLevelSelect();
            }
        }

        function showHint() {
            // Highlight a random unplaced item's target slot
            const unplacedItems = document.querySelectorAll('.item:not(.placed)');
            if (unplacedItems.length === 0) return;

            const randomItem = unplacedItems[Math.floor(Math.random() * unplacedItems.length)];
            const targetSlotIndex = randomItem.dataset.targetSlot;
            const targetSlot = document.querySelector(`.slot[data-slot-index="${targetSlotIndex}"]`);

            if (targetSlot && !targetSlot.classList.contains('filled')) {
                targetSlot.classList.add('highlight');
                setTimeout(() => targetSlot.classList.remove('highlight'), 2000);
            }
        }

        // Initialize
        showTitleScreen();
    </script>
</body>
</html>
